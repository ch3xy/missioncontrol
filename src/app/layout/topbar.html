<header class="topbar">
  <div class="topbar-mobile">
    <button
      type="button"
      class="icon-btn"
      (click)="openMenu.emit()"
      [attr.aria-label]="'topbar.openMenu' | t"
      aria-controls="sidenav"
      [attr.aria-expanded]="drawerOpen()"
    >
      <svg lucideMenu [size]="22"></svg>
    </button>
    <span class="mobile-title">mission control</span>
  </div>

  <div class="topbar-context">
    <span class="topbar-label">{{ 'topbar.label' | t }}</span>
    <time [attr.datetime]="today().toISOString()">
      {{ today() | date: ('format.date' | t) : undefined : i18n.locale() }}
    </time>
  </div>

  <div class="topbar-actions">
    <button
      type="button"
      class="btn btn-ghost btn-icon"
      (click)="theme.toggle()"
      [title]="'topbar.toggleTheme' | t"
      [attr.aria-label]="'topbar.toggleTheme' | t"
    >
      @if (theme.theme() === 'dark') {
        <svg lucideSun [size]="18"></svg>
      } @else {
        <svg lucideMoon [size]="18"></svg>
      }
    </button>
  </div>
</header>
