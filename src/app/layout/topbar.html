<header class="topbar">
  <div class="topbar-mobile">
    <button
      type="button"
      class="icon-btn"
      (click)="openMenu.emit()"
      aria-label="Open menu"
      aria-controls="sidenav"
      [attr.aria-expanded]="drawerOpen()"
    >
      <svg lucideMenu [size]="22"></svg>
    </button>
    <span class="mobile-title">mission control</span>
  </div>

  <div class="topbar-context">
    <span class="topbar-label">Local-first dashboard</span>
    <time [attr.datetime]="today().toISOString()">
      {{ today() | date: 'EEE, dd MMM yyyy' }}
    </time>
  </div>

  <div class="topbar-actions">
    <button
      type="button"
      class="btn btn-ghost btn-icon"
      (click)="theme.toggle()"
      title="Toggle theme"
      aria-label="Toggle theme"
    >
      @if (theme.theme() === 'dark') {
        <svg lucideSun [size]="18"></svg>
      } @else {
        <svg lucideMoon [size]="18"></svg>
      }
    </button>
  </div>
</header>
